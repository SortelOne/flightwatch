[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightwatch"
version = "1.0.0"
description = "Self-hosted cheap flight watcher with Discord alerts"
requires-python = ">=3.11"
# fli reads Google Flights directly. It's unofficial, so it's pinned to a known
# version; bump it if Google changes something and searches start failing.
dependencies = ["flights==0.11.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flightwatch = "flightwatch.cli:main"

[tool.setuptools]
packages = ["flightwatch"]
