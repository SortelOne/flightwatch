# Flightwatch config. Edit this any time: each scan re-reads it, no restart needed.
# Check your changes with:  flightwatch check-config

# Home airports. They're searched together, so a deal from either one shows up.
origins = ["ORD", "MDW"]

currency = "USD"

[trip]
adults = 2
cabin = "economy"          # economy, premium_economy, business, first
max_stops = 1              # per direction: 0 = nonstop only, 1 = up to one layover
min_layover_minutes = 90   # no layover shorter than 1h 30m (0 = no minimum)
max_layover_minutes = 360  # no layover longer than 6 hours (0 = no maximum)

# Travel window: leave on or after earliest_departure, be home by latest_return.
earliest_departure = "2027-03-01"
latest_return      = "2027-06-30"

# Which day you leave and how many nights you stay.
# Thursday + 5 nights = home on Tuesday. That's 17 trips from March to June 2027.
# For any day of the week, use:  depart_weekdays = []   and e.g.  nights = [5, 6, 7]
depart_weekdays = ["thu"]  # mon, tue, wed, thu, fri, sat, sun
nights = [5]

# ---------------------------------------------------------------------------
# Where you want to go:  AIRPORT CODE = max price
# The price is the round-trip total for everyone in `adults` (both of you).
# You get a Discord message when a fare drops to or below it.
#
# Add or remove lines freely. For a destination that needs different dates,
# trip length or stops, use a table and override just those keys:
#   NRT = { max_price = 1800, depart_weekdays = ["fri"], nights = [9], earliest_departure = "2027-05-01" }
# ---------------------------------------------------------------------------
[destinations]
LIS = 1400
CUN = 700
HNL = 900

[alerts]
# After alerting on a destination, stay quiet about it unless the price drops by
# at least this much more, or this many days pass (a "still cheap" reminder).
min_drop_to_realert = 25
realert_after_days = 3
# Post a warning to Discord (at most once a day) if every search in a scan fails.
notify_on_errors = true

[scanner]
# Set to true to stop scanning without uninstalling anything.
paused = false
# Be gentle with Google: slower requests are less likely to get this IP blocked.
requests_per_second = 2
pause_between_destinations = [5, 20]   # random seconds between destinations
# How many outbound options to check when looking up the flight details for a deal.
detail_candidates = 5

# Where price history is kept (the installer creates this folder).
# database = "/var/lib/flightwatch/flightwatch.db"
